name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm eval:retrieval
      - run: pnpm eval:investigations
      - run: pnpm build
      - run: pnpm security:scan
      - run: pnpm audit --audit-level moderate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  sql-analyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check --manifest-path packages/sql_guard/Cargo.toml
      - run: cargo test --locked --manifest-path packages/sql_guard/Cargo.toml
      - run: cargo check --locked --target wasm32-unknown-unknown --manifest-path packages/sql_guard/Cargo.toml
      - run: cargo install wasm-pack --locked --version 0.15.0
      - run: wasm-pack build packages/sql_guard --target web --release --out-dir ../../.git/wasm-check
