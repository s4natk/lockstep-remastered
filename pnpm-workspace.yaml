packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - miniflare@5.20261101.0-beta
  - wrangler@4.156.1

overrides:
  zod: "^4.6.6"
  sharp: "^0.35.5"
  undici: "^7.30.1"
  minimatch: "^11.0.1"

# No published picomatch release fixes this. It is only pulled in by eslint and
# secretlint, and those tools do not match attacker-controlled extglobs.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
